name: Rust packaging integration

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "crates/foundation-packaging/**"
      - ".github/workflows/rust-packaging.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/foundation-packaging/**"
      - ".github/workflows/rust-packaging.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace
