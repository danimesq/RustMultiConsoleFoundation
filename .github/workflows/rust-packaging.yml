name: Rust packaging and runtime integration

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "crates/foundation-packaging/**"
      - "crates/foundation-runtime/**"
      - ".github/workflows/rust-packaging.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/foundation-packaging/**"
      - "crates/foundation-runtime/**"
      - ".github/workflows/rust-packaging.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test workspace with native SDL3 host
        run: cargo test --workspace --features foundation-runtime/native-sdl3
      - name: Check browser Canvas 2D and WebAudio host for WebAssembly
        run: cargo check -p foundation-runtime --target wasm32-unknown-unknown --features web-canvas
